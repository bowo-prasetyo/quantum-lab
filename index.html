<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Qubit: a quantum lab in your browser</title>

  <meta name="description" content="Learn how a quantum computer works by doing it: apply gates to 1, 2 and 3 qubits and see every effect at once. Free, no install, no accounts." />
  <meta name="theme-color" content="#111111" />
  <!-- Apply a saved light or dark choice before the first paint (see theme.js) -->
  <script>
    try {
      var theme = JSON.parse(localStorage.getItem('glass-qubit-theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) { /* no saved choice */ }
  </script>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />

  <!--
    Library versions are pinned so a new release on the CDN cannot change or
    break the app. The integrity hash makes the browser refuse a file whose
    contents differ from the one tested. To upgrade, change the version and
    the matching hash together (see README, "Library Versions").
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.prod.js"
    integrity="sha384-tORx0bXmMnTC28EYQe1coaGZKSQupXQEYDBNex8xkzJ9iqUoNy9Y+VFBhVxi4kUr"
    crossorigin="anonymous"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/vue-router@4.6.4/dist/vue-router.global.prod.js"
    integrity="sha384-A4bHjHQxfxIvuD8PBtwmSWs3Iu2iAYs4ay5uVK2xBRObO41s5ZQF3016uyadsK/V"
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
